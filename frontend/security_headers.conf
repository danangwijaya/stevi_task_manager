# Included in every location of the HTTPS server: add_header of a location replaces (does not extend) the one of its server.
# HSTS for 30 days first; raise it once a few weeks have passed without a certificate problem.
add_header Strict-Transport-Security "max-age=2592000" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
