# Proxy cache zone for Sentinel-2 raster tiles (max 2GB, 7 days retention)
proxy_cache_path /var/cache/nginx/tiles levels=1:2 keys_zone=tile_cache:20m max_size=2g inactive=7d use_temp_path=off;

# HTTP Server (Port 80) -> Redirect to HTTPS
server {
    listen 80;
    server_name geostevia.id www.geostevia.id 182.23.160.75 _;
    client_max_body_size 100M;

    # ACME challenge for future certbot renewals
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS Server (Port 443)
server {
    listen 443 ssl;
    server_name geostevia.id www.geostevia.id 182.23.160.75 _;
    client_max_body_size 100M;

    ssl_certificate /etc/letsencrypt/live/geostevia.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/geostevia.id/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Enable Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/json image/svg+xml;

    # Static Assets with long cache
    location /assets/ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # SPA Routing
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Cache Sentinel-2 Raster Tiles (Super fast map panning)
    location /api/v1/raster/tiles/ {
        proxy_pass http://backend:8000/api/v1/raster/tiles/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_cache tile_cache;
        proxy_cache_key "$scheme$request_method$host$request_uri";
        proxy_cache_valid 200 7d;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_lock on;
        add_header X-Cache-Status $upstream_cache_status;
    }

    # Backend API Reverse Proxy
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Extended timeouts for long-running dataset rasterization
        proxy_read_timeout 300s;
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
    }
}
